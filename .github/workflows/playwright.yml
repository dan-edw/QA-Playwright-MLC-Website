name: Playwright Tests
on:
   workflow_dispatch:
    inputs:
     environment:
      description: Environment
      required: true
      type: choice
      default: UAT
      options:
       - UAT
       - PROD

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{github.event.inputs.environment }}
    timeout-minutes: 60
    
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-node@v6
      with: 
       node-version: 24

    # ----------------------------------------
    # Step 1: Playwright Setup
    # ----------------------------------------
       
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    # ----------------------------------------
    # Step 2: Run Playwright Tests
    # ----------------------------------------
      
    - name: Run Playwright tests
      run: npx playwright test

    # ----------------------------------------
    # Step 3: Prepare JUnit XML for Xray
    # ----------------------------------------

    - name: Prepare JUnit XML for Xray
      if: always()
      run: node scripts/xray-junit-convert.js
    
    # ----------------------------------------
    # Debug: Generated JUnit XML
    # ----------------------------------------  

    - name: Debug generated JUnit XML
      run: |
        echo "=== Current directory ==="
        pwd

        echo ""
        echo "=== XML files ==="
        find . -name "*.xml"

        echo ""
        echo "=== test-results.xml ==="
        head -40 test-results.xml

    # ----------------------------------------
    # Step 4: Authenticate with Xray Cloud
    # ----------------------------------------
    - name: Authenticate with Xray Cloud
      if: always()
      id: xray-auth
      shell: bash
      run: |
        TOKEN=$(curl -s \
          -H "Content-Type: application/json" \
          -X POST \
          https://xray.cloud.getxray.app/api/v2/authenticate \
          -d '{
            "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
            "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
          }')

        TOKEN=$(echo "$TOKEN" | tr -d '"')

        echo "XRAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

        echo "Authentication successful"

    # ----------------------------------------
    # Debug: Verify Files
    # ----------------------------------------
    - name: Verify files
      run: |
       ls -la
       echo "-----"
       ls -la playwright-report || true
       echo "-----"
       ls -la test-results || true

    # ----------------------------------------
    # Step 5: Publish the Results to Xray
    # ----------------------------------------

    - name: Publish Results to Xray
      if: always()
      shell: bash
      run: |

       RESPONSE=$(curl -s \
        --fail-with-body \
        -H "Authorization: Bearer $XRAY_TOKEN" \
        -H "Content-Type: text/xml" \
        --data @"test-results.xml" \
        "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${{ secrets.XRAY_PROJECT_KEY }}"
       )

       echo "===== XRAY RESPONSE ====="
       echo "$RESPONSE"

    # ----------------------------------------
    # Step 6: Generate Playwright Test Summary
    # ----------------------------------------

    - name: Generate Playwright Test Summary
      if: always()
      shell: bash
      run: |

        TOTAL=$(grep -o 'tests="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        FAILED=$(grep -o 'failures="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        SKIPPED=$(grep -o 'skipped="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')

        PASSED=$((TOTAL - FAILED - SKIPPED))

        TEST_CASES=$(grep -c "<testcase" test-results.xml)

        BROWSERS=$(grep 'hostname=' test-results.xml \
         | sed -E 's/.*hostname="([^"]+)".*/\1/' \
         | sort -u \
         | wc -l)

        {
         echo "## 🧪 Playwright Test Execution Summary"
         echo ""
         echo "| Metric | Count |"
         echo "|--------|------:|"
         echo "| 📋 Test Cases | $((TEST_CASES / BROWSERS)) |"
         echo "| 🌐 Browsers | $BROWSERS |"
         echo "| ▶️ Test Executions | $TOTAL |"
         echo "| ✅ Passed | $PASSED |"
         echo "| ⚠️ Skipped | $SKIPPED |"
         echo "| ❌ Failed | $FAILED |"
        } >> "$GITHUB_STEP_SUMMARY"

    # ----------------------------------------
    # Step 7: Publish Environment Summary
    # ----------------------------------------

    - name: Publish Environment Summary
      if: always()
      shell: bash
      run: |
       {
        echo ""
        echo "## 🌐 Execution Configuration"
        echo ""
        echo "| Setting | Value |"
        echo "|---------|-------|"
        echo "| Environment | ${ENVIRONMENT} |"
        echo "| Browser Coverage | Chromium, Firefox, WebKit, Microsoft Edge |"
        echo "| Framework | Playwright |"
        echo "| Report Format | JUnit XML, Playwright HTML |"
        echo "| Operating System | Ubuntu Latest |"
        echo "| Node Version | 24 |"
       } >> "$GITHUB_STEP_SUMMARY"

    # ----------------------------------------
    # Step 8: Publish Reports
    # ----------------------------------------
    
    - name: Publish Reports Available
      if: always()
      run: |
        {
          echo ""
          echo "## 📄 Reports"
          echo ""
          echo "- 📊 HTML Report available in workflow artifacts"
          echo "- 📄 JUnit XML available in workflow artifacts"
        } >> $GITHUB_STEP_SUMMARY

    
    # ----------------------------------------
    # Step 9: Upload Playwright Report
    # ----------------------------------------
    
    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
      
    # ----------------------------------------
    # Step 10: Upload JUnit Results
    # ----------------------------------------
    
    - name: Upload JUnit Results 
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: junit-results
        path: test-results.xml
        retention-days: 10
