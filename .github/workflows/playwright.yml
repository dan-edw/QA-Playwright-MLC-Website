name: Playwright Tests
on:
   workflow_dispatch:
    inputs:
     environment:
      description: Environment
      required: true
      type: choice
      default: UAT
      options:
       - UAT
       - PROD

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{github.event.inputs.environment }}
    timeout-minutes: 60
    
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-node@v6
      with: 
       node-version: 24

    # ----------------------------------------
    # Step 1: Playwright Setup
    # ----------------------------------------
       
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: |
        npx playwright install --with-deps
        npx playwright install msedge

    
    # ----------------------------------------
    # Step 2: Run Playwright Tests
    # ----------------------------------------
      
    - name: Run Playwright tests
      id: playwright
      shell: bash
      run: |
        set +e

        npx playwright test
        PLAYWRIGHT_EXIT_CODE=$?

        echo "Playwright exit code: $PLAYWRIGHT_EXIT_CODE"
        echo "exit_code=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ ! -d "test-results" ]; then
          echo "ERROR: Playwright did not generate test-results"
          exit 1
        fi

        echo ""
        echo "Playwright execution completed."
        echo "Test failures will be reported in Xray."

        exit 0

    
     
    # ----------------------------------------
    # Step 3: Prepare JUnit XML for Xray
    # ----------------------------------------

    - name: Prepare JUnit XML for Xray
      id: prepare-xray
      if: always()
      shell: bash
      run: |
        node scripts/xray-junit-convert.js

        if [ ! -f "xray-results.xml" ]; then
          echo "ERROR: Xray conversion did not generate xray-results.xml"
          exit 1
        fi

        TESTCASE_COUNT=$(python3 - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse("xray-results.xml").getroot()
        print(len(root.findall(".//testcase")))
        PY
        )

        echo "Logical Xray tests generated: $TESTCASE_COUNT"

        if [ "$TESTCASE_COUNT" -eq 0 ]; then
          echo "ERROR: No Xray testcases found"
          exit 1
        fi

        echo ""
        echo "=== Generated Xray JUnit ==="
        cat xray-results.xml




    # ----------------------------------------
    # Step 4: Authenticate with Xray Cloud
    # ----------------------------------------
    - name: Authenticate with Xray Cloud
      if: ${{ always() && steps.prepare-xray.outcome == 'success' }}
      id: xray-auth
      shell: bash
      env:
        XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
        XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      run: |
        if [ -z "$XRAY_CLIENT_ID" ]; then
          echo "ERROR: XRAY_CLIENT_ID is empty"
          exit 1
        fi

        if [ -z "$XRAY_CLIENT_SECRET" ]; then
          echo "ERROR: XRAY_CLIENT_SECRET is empty"
          exit 1
        fi

        HTTP_CODE=$(curl -s \
          -o xray-auth-response.json \
          -w "%{http_code}" \
          -H "Content-Type: application/json" \
          -X POST \
          "https://xray.cloud.getxray.app/api/v2/authenticate" \
          -d "{
          \"client_id\":\"${XRAY_CLIENT_ID}\",
          \"client_secret\":\"${XRAY_CLIENT_SECRET}\"
        }")

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "ERROR: Xray authentication failed with HTTP $HTTP_CODE"
          exit 1
        fi

        TOKEN=$(tr -d '"' < xray-auth-response.json)

        if [ -z "$TOKEN" ]; then
          echo "ERROR: Xray returned an empty token"
          exit 1
        fi

        echo "::add-mask::$TOKEN"
        echo "XRAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

        echo "Xray authentication successful."


    # ----------------------------------------
    # Step 5: Publish the Results to Xray
    # ----------------------------------------

    - name: Publish Results to Xray
      if: ${{ always() && steps.prepare-xray.outcome == 'success' && steps.xray-auth.outcome == 'success' }}
      id: publish-xray
      shell: bash
      env:
        XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
        XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
      run: |
        if [ -z "$XRAY_TOKEN" ]; then
          echo "ERROR: XRAY_TOKEN is empty"
          exit 1
        fi

        if [ ! -f "xray-results.xml" ]; then
          echo "ERROR: xray-results.xml does not exist"
          exit 1
        fi

        TESTCASE_COUNT=$(python3 - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse("xray-results.xml").getroot()
        print(len(root.findall(".//testcase")))
        PY
        )


        echo "Xray testcases being imported: $TESTCASE_COUNT"

        if [ "$TESTCASE_COUNT" -eq 0 ]; then
          echo "ERROR: No Xray testcases found in xray-results.xml"
          exit 1
        fi

        XRAY_IMPORT_URL="https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}"

        HTTP_CODE=$(curl -s \
          -o xray-import-response.json \
          -w "%{http_code}" \
          -H "Authorization: Bearer ${XRAY_TOKEN}" \
          -H "Content-Type: text/xml" \
          --data-binary "@xray-results.xml" \
          "$XRAY_IMPORT_URL")

        echo "HTTP status: $HTTP_CODE"

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "ERROR: Xray JUnit import failed"
          cat xray-import-response.json
          exit 1
        fi

        XRAY_EXECUTION_KEY=$(jq -r '.key // empty' xray-import-response.json)
        XRAY_EXECUTION_ID=$(jq -r '.id // empty' xray-import-response.json)

        if [ -z "$XRAY_EXECUTION_KEY" ]; then
          echo "ERROR: Xray import succeeded but no Test Execution key was returned"
          cat xray-import-response.json
          exit 1
        fi

        echo "XRAY_EXECUTION_KEY=$XRAY_EXECUTION_KEY" >> "$GITHUB_OUTPUT"
        echo "XRAY_EXECUTION_ID=$XRAY_EXECUTION_ID" >> "$GITHUB_OUTPUT"

        echo "Xray Test Execution: $XRAY_EXECUTION_KEY"


    # ----------------------------------------
    # Step 6: Generate Playwright Test Summary
    # ----------------------------------------

    - name: Generate Playwright Test Summary
      if: always()
      shell: bash
      run: |

        TOTAL=$(grep -o 'tests="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        FAILED=$(grep -o 'failures="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        SKIPPED=$(grep -o 'skipped="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')

        PASSED=$((TOTAL - FAILED - SKIPPED))

        TEST_CASES=$(grep -c "<testcase" test-results.xml)

        BROWSERS=$(grep 'hostname=' test-results.xml \
         | sed -E 's/.*hostname="([^"]+)".*/\1/' \
         | sort -u \
         | wc -l)

        {
         echo "## 🧪 Playwright Test Execution Summary"
         echo ""
         echo "| Metric | Count |"
         echo "|--------|------:|"
         echo "| 📋 Test Cases | $((TEST_CASES / BROWSERS)) |"
         echo "| 🌐 Browsers | $BROWSERS |"
         echo "| ▶️ Test Executions | $TOTAL |"
         echo "| ✅ Passed | $PASSED |"
         echo "| ⚠️ Skipped | $SKIPPED |"
         echo "| ❌ Failed | $FAILED |"
        } >> "$GITHUB_STEP_SUMMARY"

    # ----------------------------------------
    # Step 7: Publish Environment Summary
    # ----------------------------------------

    - name: Publish Environment Summary
      if: always()
      shell: bash
      run: |
       {
        echo ""
        echo "## 🌐 Execution Configuration"
        echo ""
        echo "| Setting | Value |"
        echo "|---------|-------|"
        echo "| Environment | ${ENVIRONMENT} |"
        echo "| Browser Coverage | Chromium, Firefox, WebKit, Microsoft Edge |"
        echo "| Framework | Playwright |"
        echo "| Report Format | JUnit XML, Playwright HTML |"
        echo "| Operating System | Ubuntu Latest |"
        echo "| Node Version | 24 |"
       } >> "$GITHUB_STEP_SUMMARY"

    # ----------------------------------------
    # Step 8: Publish Reports
    # ----------------------------------------
    
    - name: Publish Reports Available
      if: always()
      run: |
        {
          echo ""
          echo "## 📄 Reports"
          echo ""
          echo "- 📊 HTML Report available in workflow artifacts"
          echo "- 📄 JUnit XML available in workflow artifacts"
        } >> $GITHUB_STEP_SUMMARY

    
    # ----------------------------------------
    # Step 9: Upload Playwright Report
    # ----------------------------------------
    
    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
      
    # ----------------------------------------
    # Step 10: Upload JUnit Results
    # ----------------------------------------
    
    - name: Upload JUnit Results 
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: junit-results
        path: test-results.xml
        retention-days: 10
